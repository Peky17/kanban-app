<div
  class="card chatbot-container shadow-sm"
  [ngStyle]="
    chatbotPosition.x !== null && chatbotPosition.y !== null
      ? {
          left: chatbotPosition.x + 'px',
          top: chatbotPosition.y + 'px',
          right: 'auto',
          bottom: 'auto',
          transform: 'none',
          position: 'fixed'
        }
      : {}
  "
>
  <div
    class="card-header bg-primary text-white d-flex justify-content-between align-items-center chatbot-drag-area"
    (mousedown)="onDragStart($event)"
    [ngStyle]="{ cursor: dragging ? 'grabbing' : 'grab', userSelect: 'none' }"
  >
    <div class="w-100 d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Chatbot Assistant (Personal tasks)</h5>
      <button
        class="btn btn-sm btn-danger"
        (click)="closeChatbot()"
        aria-label="Close"
      >
        <i class="fa fa-times"></i>
      </button>
    </div>
  </div>
  <div
    class="card-body chatbot-messages"
    [ngStyle]="expanded ? { height: '600px' } : { height: '350px' }"
    style="overflow-y: auto"
  >
    <div
      *ngFor="let msg of messages"
      [ngClass]="{
        'text-end': msg.from === 'user',
        'text-start': msg.from === 'bot'
      }"
    >
      <div
        class="d-inline-block p-2 my-1 rounded"
        [ngClass]="{
          'bg-primary text-white': msg.from === 'user',
          'bg-light border': msg.from === 'bot'
        }"
        [style.maxWidth]="msg.from === 'user' ? '80%' : '100%'"
        [style.minWidth]="msg.from === 'user' ? '120px' : '100%'"
        [style.width]="msg.from === 'bot' ? '100%' : 'auto'"
      >
        <!-- Renderizar cards de personalTasks si existen -->
        <ng-container *ngIf="msg.personalTasks">
          <div class="row g-2 mb-2">
            <div
              class="col-12 col-md-6 col-lg-4"
              *ngFor="let task of msg.personalTasks; let i = index"
            >
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <span class="badge bg-secondary mb-1">{{ i + 1 }}</span>
                  <div class="fw-bold">{{ task.title }}</div>
                  <div class="text-muted">{{ task.description }}</div>
                </div>
              </div>
            </div>
          </div>
          <div *ngIf="msg.text">{{ msg.text }}</div>
        </ng-container>
        <!-- Buckets como cards -->
        <ng-container *ngIf="msg.bucketOptions">
          <div class="row g-2 mb-2">
            <div
              class="col-12 col-md-6 col-lg-4"
              *ngFor="let bucket of msg.bucketOptions; let i = index"
            >
              <div class="card h-100 shadow-sm border-primary">
                <div class="card-body">
                  <span class="badge bg-primary mb-1">{{ i + 1 }}</span>
                  <div class="fw-bold">{{ bucket.name }}</div>
                  <div class="text-muted">ID: {{ bucket.id }}</div>
                </div>
              </div>
            </div>
          </div>
          <div *ngIf="msg.text">{{ msg.text }}</div>
        </ng-container>
        <!-- Mensaje normal -->
        <ng-container *ngIf="!msg.personalTasks && !msg.tasks">
          {{ msg.text }}
        </ng-container>
        <!-- Mensaje de tareas asignadas (legacy) -->
        <ng-container *ngIf="msg.tasks">
          <div>{{ msg.text }}</div>
          <ul class="list-group list-group-flush">
            <li
              *ngFor="let task of msg.tasks"
              class="list-group-item px-0 py-1"
            >
              <span class="fw-bold">{{ task.name }}</span>
              <span
                class="badge ms-2"
                [ngClass]="{
                  'bg-success': task.completed === true,
                  'bg-danger': task.completed === false
                }"
              >
                {{ task.completed === true ? "Completed" : "Pending" }}
              </span>
            </li>
          </ul>
        </ng-container>
      </div>
    </div>
    <div *ngIf="loading" class="text-center my-2">
      <span class="spinner-border spinner-border-sm"></span> Thinking...
    </div>
  </div>
  <div class="card-footer">
    <form (ngSubmit)="sendMessage()" class="d-flex">
      <input
        type="text"
        class="form-control me-2"
        [(ngModel)]="userInput"
        [placeholder]="'Type your query about tasks...'"
        name="chatInput"
        autocomplete="off"
        [disabled]="loading"
      />
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="loading || !userInput.trim()"
      >
        Send
      </button>
    </form>
  </div>
</div>
