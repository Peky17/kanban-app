<main class="jumbotron" role="main">
  <!-- Info section -->
  <section class="jumbotron text-center">
    <div class="container">
      <h1 class="jumbotron-heading">My Kanban Boards</h1>
      <p class="lead text-muted">
        Here you can manage your personal Kanban boards
      </p>
    </div>
    <button class="btn btn-primary" title="Create new board">
      Create New Board
      <i class="fa fa-plus"></i>
    </button>
  </section>
  <br />
  <section class="jumbotron text-center">
    <div class="container">
      <div class="row">
        <!-- cards -->
        <div class="col-lg-3" *ngFor="let board of personalBoards">
          <div class="card-module card mb-3">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <span><i class="fa fa-table"></i></span>
              <div class="btn-group" role="group">
                <button
                  class="btn btn-link btn-sm"
                  (click)="redirectToBoards(board)"
                  title="View Kanban board"
                >
                  <i class="fa fa-eye"></i>
                </button>
                <button
                  class="btn btn-link btn-sm"
                  (click)="editBoard(board)"
                  title="Update board"
                >
                  <i class="fa fa-edit"></i>
                </button>
                <button
                  class="btn btn-link btn-sm text-danger"
                  (click)="deleteBoard(board)"
                  title="Delete board"
                >
                  <i class="fa fa-trash"></i>
                </button>
              </div>
            </div>
            <div class="card-body">
              <h4 class="card-title">
                {{ board.name }}
              </h4>
              <p class="card-text">{{ board.description }}</p>
            </div>
            <div class="card-footer text-muted">
               {{ board.createdAt | date : "medium" }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
