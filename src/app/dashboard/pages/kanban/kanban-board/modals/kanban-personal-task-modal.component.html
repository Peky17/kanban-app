<div class="modal-header">
  <h4 class="modal-title">
    {{ mode === 'create' ? 'New Task' : 'Edit Task' }}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <form [formGroup]="taskForm" (ngSubmit)="saveTask()">
    <div class="form-group mb-2">
      <label for="title"><b>Title</b></label>
      <input formControlName="title" type="text" class="form-control" id="title" placeholder="Task title" />
    </div>
    <div class="form-group mb-2">
      <label for="description"><b>Description</b></label>
      <textarea class="form-control" formControlName="description" placeholder="Task description"></textarea>
    </div>
    <div class="form-group mb-2">
      <label for="dueDate"><b>Due Date</b></label>
      <input formControlName="dueDate" type="date" class="form-control" id="dueDate" />
    </div>
    <input formControlName="createdAt" type="date" class="form-control" hidden />
    <input formControlName="bucketId" type="number" class="form-control" hidden />
    <input formControlName="userId" type="number" class="form-control" hidden />
    <input formControlName="completed" type="checkbox" class="form-check-input" hidden />
    <br />
    <button type="submit" class="btn btn-primary w-100">
      {{ mode === 'create' ? 'Save Task' : 'Update Task' }}
      <i class="fa fa-check ms-2"></i>
    </button>
  </form>
</div>
