<div class="container overflow-auto">
  <!-- Loader -->
  <app-loader *ngIf="isLoading"></app-loader>

  <!-- Alerta de validación si no hay buckets y no está cargando -->
  <div>
    <div
      *ngIf="!isLoading && buckets.length === 0"
      class="d-flex justify-content-center align-items-center mt-4"
    >
      <div class="alert alert-warning text-center w-50" role="alert">
        <strong>Warning!</strong> There are no buckets to display on this board.
      </div>
    </div>
  </div>
  <!-- Buckets -->
  <div class="row" *ngIf="!isLoading && buckets.length > 0">
    <div class="col" *ngFor="let bucket of buckets">
      <div class="card mb-3" style="max-width: 20rem">
        <div
          class="card-header d-flex justify-content-between align-items-center bg-{{
            bucket.color
          }}"
        >
          <h4 class="mb-0">{{ bucket.name }}</h4>
          <div class="btn-group btn-group-sm ms-2" style="z-index: 2">
            <button
              type="button"
              class="btn btn-primary btn-sm"
              (click)="openCreatePersonalTaskModal(bucket)"
            >
              <i class="fa fa-plus"></i>
            </button>
            <button
              type="button"
              class="btn btn-light btn-sm"
              (click)="openEditBucketModal(bucket)"
            >
              <i class="fa fa-edit"></i>
            </button>
            <button
              type="button"
              class="btn btn-danger btn-sm"
              (click)="confirmDeleteBucket(bucket)"
            >
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Tasks here -->
          <div
            cdkDropList
            [id]="'list-' + bucket.id"
            [cdkDropListConnectedTo]="getConnectedLists()"
            [cdkDropListData]="bucketTasks[getBucketPosition(bucket.id)].tasks"
            class="example-list"
            (cdkDropListDropped)="drop($event)"
          >
            <div
              *ngFor="
                let task of bucketTasks[getBucketPosition(bucket.id)].tasks;
                trackBy: trackByTaskId
              "
            >
              <div class="example-box" cdkDrag>
                {{ task.title }}
                <div class="btn-group btn-sm">
                  <button
                    title="View Details"
                    class="btn btn-secondary btn-sm"
                    data-bs-toggle="offcanvas"
                    [attr.data-bs-target]="'#offcanvasExample' + task.id"
                    aria-controls="offcanvasExample"
                  >
                    <i class="fa fa-eye"></i>
                  </button>
                  <button
                    title="Edit Personal Task"
                    class="btn btn-secondary btn-sm"
                    (click)="openEditPersonalTaskModal(task)"
                  >
                    <i class="fa fa-edit"></i>
                  </button>
                  <button
                    title="Delete Personal Task"
                    class="btn btn-secondary btn-sm"
                    (click)="deletePersonalTask(task)"
                  >
                    <i class="fa fa-trash"></i>
                  </button>
                </div>
              </div>

              <!-- Offcanvas for task details -->
              <div
                class="offcanvas offcanvas-start"
                tabindex="-1"
                [id]="'offcanvasExample' + task.id"
                [attr.aria-labelledby]="'offcanvasExampleLabel' + task.id"
              >
                <!-- canvas header -->
                <div class="offcanvas-header">
                  <h3
                    class="offcanvas-title"
                    [id]="'offcanvasExampleLabel' + task.id"
                  >
                    {{ task.title }}
                  </h3>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close"
                  ></button>
                </div>
                <!-- canvas body -->
                <div class="offcanvas-body" style="text-align: left">
                  <p><b>Due Date:</b> {{ task.dueDate }}</p>
                  <p><b>Created At:</b> {{ task.createdAt }}</p>
                  <br />
                  <h5>Task description:</h5>
                  <div>{{ task.description }}</div>
                  <br />
                  <!-- Actions -->
                  <h5>Actions:</h5>
                  <div class="btn-group">
                    <button
                      class="btn btn-success"
                      (click)="markTaskAsCompleted(task)"
                      data-bs-dismiss="offcanvas"
                    >
                      Mark as Done! <i class="fa fa-check"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating Action Button (FAB) -->
<div class="fab-container">
  <button *ngIf="!fabOpen" class="fab-main" (click)="toggleFab()">
    <i class="fa fa-plus"></i>
  </button>
  <div class="fab-actions" [class.open]="fabOpen" *ngIf="fabOpen">
    <button
      class="fab-action"
      title="Create bucket"
      (click)="openCreateBucketModal()"
    >
      <i class="fa fa-bookmark"></i>
    </button>
    <button class="fab-action" title="Chatbot">
      <i class="fa fa-comments"></i>
    </button>
  </div>
  <button class="fab-action" title="Close" (click)="closeFab()">
    <i class="fa fa-times"></i>
  </button>
</div>
